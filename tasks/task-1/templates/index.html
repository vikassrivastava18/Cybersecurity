<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Flask SQLite Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        padding: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Users</h1>

    <form method="POST" action="{{ url_for('add_user') }}">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Add User</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>          
        </tr>
        {% else %}
        <tr>
          <td colspan="3">No users found.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
